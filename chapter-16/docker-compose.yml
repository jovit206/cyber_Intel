services:
  mongo16:
    image: mongo:7.0
    container_name: chapter16-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27020:27017"
    volumes:
      - chapter16_mongo_data:/data/db
    networks:
      - chapter16-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  cassandra16:
    image: cassandra:4.1
    container_name: chapter16-cassandra
    restart: unless-stopped
    ports:
      - "127.0.0.1:9043:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: chapter16-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - chapter16_cassandra_data:/var/lib/cassandra
    networks:
      - chapter16-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  neo4j16:
    image: neo4j:5-community
    container_name: chapter16-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in chapter-16/.env}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - chapter16_neo4j_data:/data
      - chapter16_neo4j_logs:/logs
    networks:
      - chapter16-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7687'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  fraud-service:
    image: jovit206/lab-16:1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chapter16-fraud-service
    restart: "no"
    environment:
      MONGO_URI: mongodb://mongo16:27017
      MONGO_DATABASE: university_db
      FRAUD_MONGO_DATABASE: fraud_detection
      CASSANDRA_HOSTS: cassandra16
      CASSANDRA_PORT: "9042"
      NEO4J_URI: bolt://neo4j16:7687
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in chapter-16/.env}"
      NEO4J_DATABASE: neo4j
      FRAUD_MAX_HOPS: "3"
    depends_on:
      mongo16:
        condition: service_healthy
      cassandra16:
        condition: service_healthy
      neo4j16:
        condition: service_healthy
    networks:
      - chapter16-net

networks:
  chapter16-net:
    name: chapter16-net
    driver: bridge

volumes:
  chapter16_mongo_data:
    name: chapter16_mongo_data
  chapter16_cassandra_data:
    name: chapter16_cassandra_data
  chapter16_neo4j_data:
    name: chapter16_neo4j_data
  chapter16_neo4j_logs:
    name: chapter16_neo4j_logs
